<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#2c1a0c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="קטאן">
<title>קטאן</title>
<link rel="manifest" id="manifest-link">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- מסך פתיחה -->
<div id="setup-screen">
  <div class="setup-card">
    <h1>קָטָאן</h1>
    <p class="subtitle">משחק התיישבות, מסחר ובנייה</p>

    <div class="setup-row">
      <span class="setup-label">מספר שחקנים:</span>
      <div id="pcount">
        <button data-n="3" class="active">3</button>
        <button data-n="4">4</button>
      </div>
    </div>

    <div id="player-rows"></div>

    <button id="start-btn" class="big-btn">התחל משחק</button>
    <p class="fineprint">גרסת מעריצים ביתית וחינמית, ללא קשר ליוצרי המשחק המקורי.</p>
  </div>
</div>

<!-- מסך המשחק -->
<div id="game" class="hidden">
  <header id="topbar">
    <div id="title">קָטָאן</div>
    <div id="turn-indicator"></div>
    <div id="dice-area">
      <div class="die" id="die1"></div>
      <div class="die" id="die2"></div>
      <button id="roll-btn" class="hidden">הטל קוביות 🎲</button>
    </div>
    <div id="bank-info"></div>
    <button id="sound-btn" class="topbar-btn" title="סאונד">🔊</button>
    <button id="end-game-btn" class="topbar-btn hidden" title="סיים משחק">⛔</button>
    <button id="install-btn" class="hidden">📲 התקנה</button>
  </header>

  <main>
    <aside id="sidebar">
      <div id="players-panel"></div>
      <div id="log-panel">
        <h3>יומן משחק</h3>
        <div id="log"></div>
      </div>
    </aside>

    <section id="board-wrap">
      <div id="mode-banner" class="hidden"></div>
      <svg id="board" viewBox="-345 -325 690 650" preserveAspectRatio="xMidYMid meet"></svg>
      <button id="cancel-btn" class="hidden">ביטול ✖</button>
    </section>

    <aside id="panel">
      <div id="hand-panel"></div>
      <div id="actions-panel"></div>
      <div id="costs-card">
        <h3>עלויות בנייה</h3>
        <div class="cost-row"><span>דרך</span><span class="cost-icons">🌲🧱</span></div>
        <div class="cost-row"><span>יישוב</span><span class="cost-icons">🌲🧱🌾🐑</span></div>
        <div class="cost-row"><span>עיר</span><span class="cost-icons">🌾🌾⛰️⛰️⛰️</span></div>
        <div class="cost-row"><span>קלף פיתוח</span><span class="cost-icons">🐑🌾⛰️</span></div>
      </div>
    </aside>
  </main>
</div>

<!-- הנחיה לסובב את המכשיר -->
<div id="rotate-hint">
  <div class="r-icon">📱</div>
  <p>סובבו את המכשיר לרוחב כדי לשחק</p>
</div>

<!-- חלונות קופצים -->
<div id="overlay" class="hidden">
  <div id="modal"></div>
</div>

<script src="game.js"></script>
</body>
</html>
